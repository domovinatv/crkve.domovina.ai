[project]
name = "crkve-domovina-ai"
version = "0.1.0"
description = "Single-source-of-truth katalog svih crkava i sakralnih objekata u Hrvatskoj — građevine (OSM/Wikidata/Registar kulturnih dobara) + župe i vjerske pravne osobe (data.gov.hr)."
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
    "rapidfuzz>=3.14.5",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
